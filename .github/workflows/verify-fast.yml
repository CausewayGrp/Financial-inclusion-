name: Verify (fast)

on:
  pull_request:
    paths:
      - '**.py'
      - 'scripts/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'
      - 'docs/**'
      - 'audit/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-fast-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit-pip: ${{ steps.cache-pip.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

  lint-and-tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies (fast)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linters
        run: |
          set -e
          if [ -f pyproject.toml ]; then
            pip install ruff
            ruff check . || true
          fi

      - name: Run small unit tests
        run: |
          pytest -q -m "not integration" || exit 1

  smoke-browser:
    needs: lint-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright + A minimal test deps
        run: |
          npm ci --omit=dev || true
          pip install playwright pytest-playwright || true
          npx playwright install --with-deps || true

      - name: Run browser smoke tests (fast subset)
        run: |
          pytest -q tests/browser/smoke.py -k "smoke" || true

  report:
    needs: [lint-and-tests, smoke-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Upload summary artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-fast-failure-$GITHUB_RUN_ID
          path: |
            tests/reports || true
            playwright-report || true
