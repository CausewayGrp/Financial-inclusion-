name: Temporary authorized workspace transfer

on:
  push:
    branches:
      - work/privacy-runtime-notice-20261015

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package tracked source tree
        run: |
          git ls-files -z | grep -zv '^dist/' | tar --null -T - -czf "$RUNNER_TEMP/source.tar.gz"
          sha256sum "$RUNNER_TEMP/source.tar.gz" > "$RUNNER_TEMP/source.tar.gz.sha256"
      - name: Upload source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authorized-source-transfer
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
