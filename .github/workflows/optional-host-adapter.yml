# No publication, registry push, cloud credentials or deployment account.
name: Optional historical host adapter tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    name: Historical nginx and DigitalOcean image compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q nginx-light
          python scripts/tests/test_digitalocean_hosting.py
          python scripts/tests/test_digitalocean_hosting.py --image
