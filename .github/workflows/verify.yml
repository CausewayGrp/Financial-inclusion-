# Every gate the programme relies on, run from a clean checkout on every push to main and every pull request.
# A red run means the commit must not stand as a governed state. Job names are the required status checks.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  gates:
    name: Governance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Checksum manifest lists every tracked file with its current hash
        run: python3 scripts/checksums.py --check

      - name: Master regenerates every projection byte for byte
        run: python3 scripts/generate_projections.py --check

      - name: Generator unit tests
        run: python3 -m unittest discover -s scripts/projection/tests -t .

      - name: Rebuild the public site and the public-literal closure
        run: |
          python3 scripts/build.py
          python3 scripts/audit_public_literals.py

      - name: Committed outputs equal a fresh build
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short | head -50
            echo "::error::dist/ or audit/PUBLIC_LITERAL_CLOSURE.json differs from a fresh build. Rebuild, regenerate SHA256SUMS.txt and commit."
            exit 1
          fi

      - name: Repository validator
        run: python3 scripts/validate.py

      - name: Literal audit is identical under eight hash seeds
        run: python3 scripts/tests/test_literal_audit_determinism.py

      - name: Source-lineage truth test
        run: python3 audit/pre_tranche_c/source_lineage_truth_test.py

      - name: Architecture diagrams show the current navigation and counts
        run: python3 scripts/architecture_diagrams.py --check

      - name: Social images cover every route and match the governed text they were made from
        run: python3 scripts/social_images.py --check
      - name: Logo derivatives are pure resamples of the unchanged master (EAD-03)
        run: python3 scripts/logo_derivatives.py --check

      - name: Bilingual numeric invariance (every English/Arabic page pair prints the same numbers)
        run: python3 audit/tranche_c/checks/bilingual_invariance.py

      - name: Content parity (every page prints its governed copy and no ungoverned number)
        run: python3 scripts/tests/test_content_parity.py

      - name: Cutover parity (the runtime prints everything the pre-design renderer printed, while the frozen oracle is current)
        # Exit 2 means the oracle is pinned to projections a later Master transaction moved: the cutover comparison can no
        # longer be made and the content-parity step above is the standing gate (scripts/tests/test_cutover_parity.py docstring).
        run: |
          set +e
          python3 scripts/tests/test_cutover_parity.py
          rc=$?
          if [ "$rc" -eq 2 ]; then echo "::notice::Cutover oracle pinned to earlier projections; content parity is the standing gate."; exit 0; fi
          exit "$rc"

      - name: Data exports (B14 a; prepared and switched off, every value proved against the projections)
        run: python3 scripts/tests/test_exports.py --out build/exports

      - name: Attach the exports as an artefact (publishing waits on the owner's licence decision)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yfie-data-exports
          path: build/exports/
          if-no-files-found: error
          retention-days: 30

      - name: Gates leave the working tree clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short | head -50
            echo "::error::A gate wrote into the repository."
            exit 1
          fi

  browser:
    name: Browser acceptance
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned toolchain and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Public tools (Search, Compare, Cite, menu, skip link, live regions)
        run: python3 scripts/tests/test_public_tools.py

      - name: Viewport acceptance (EN/AR at 320, 390, 640 and 1440 px)
        run: python3 audit/tranche_c/checks/viewport_acceptance.py

      - name: Security headers (B14 b; every page served under dist/_headers, no policy violation)
        run: python3 scripts/tests/test_security_headers.py

      - name: Base path (owner B2; built for https://causewaygrp.com/financial-inclusion-evidence, served under the path; negative control included)
        run: python3 scripts/tests/test_base_path.py

  controls:
    # Every gate that finds its evidence in the built site is proved to still fail on the fault it was written to catch
    # (EAD-01: the cutover re-pointed those selectors, and a selector that silently matches nothing would pass the
    # suites). One full validator run per fault, so this is the slow job; it runs beside the browser one, not before it.
    name: Gate negative controls
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned toolchain
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Every gate still fails on the fault it was written to catch
        run: |
          python3 scripts/build.py
          python3 scripts/tests/test_gate_negative_controls.py
